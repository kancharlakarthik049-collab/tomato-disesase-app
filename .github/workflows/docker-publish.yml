name: Build and push Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Start app (background)
        run: |
          nohup python app.py &>/dev/null &
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:5000/health >/dev/null 2>&1; then
              echo "Server up"; break
            fi
            sleep 1
          done

      - name: Run tests
        run: pytest -q

      - name: Create models dir
        run: mkdir -p models

      - name: Fetch model (optional)
        if: ${{ secrets.MODEL_URL != '' }}
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
          MODEL_TOKEN: ${{ secrets.MODEL_TOKEN }}
        run: |
          echo "Downloading model from $MODEL_URL"
          if [ -n "$MODEL_TOKEN" ]; then
            curl -fSL -H "Authorization: Bearer $MODEL_TOKEN" "$MODEL_URL" -o models/tomato_model.h5
          else
            curl -fSL "$MODEL_URL" -o models/tomato_model.h5
          fi

      - name: Set up QEMU
        uses: docker/setup-buildx-action@v2

      - name: Build image (load locally)
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            tomato-app:ci-${{ github.sha }}

      - name: Scan image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest --exit-code 1 --severity HIGH,CRITICAL tomato-app:ci-${{ github.sha }} || (echo "Trivy found vulnerabilities" && exit 1)

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          BRANCH_NAME=${GITHUB_REF_NAME:-unknown}
          docker tag tomato-app:ci-${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:latest
          docker tag tomato-app:ci-${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${{ github.sha }}
          docker tag tomato-app:ci-${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${SHORT_SHA}
          docker tag tomato-app:ci-${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${BRANCH_NAME}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${SHORT_SHA}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${BRANCH_NAME}

      - name: Prepare release metadata
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          BRANCH_NAME=${GITHUB_REF_NAME:-unknown}
          IMAGE_LATEST=${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:latest
          IMAGE_FULL=${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${GITHUB_SHA}
          IMAGE_SHORT=${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${SHORT_SHA}
          IMAGE_BRANCH=${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${BRANCH_NAME}
          cat > image-metadata.json <<EOF
{
  "images": {
    "latest": "${IMAGE_LATEST}",
    "full_sha": "${IMAGE_FULL}",
    "short_sha": "${IMAGE_SHORT}",
    "branch": "${IMAGE_BRANCH}"
  }
}
EOF
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_ENV
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.short_sha }}
          release_name: Release ${{ env.short_sha }}
          body: |
            Automated release for Docker images
            - latest: ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:latest
            - full SHA: ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${{ github.sha }}
            - short SHA: ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${{ env.short_sha }}
            - branch: ${{ secrets.DOCKERHUB_USERNAME }}/tomato-app:${{ env.branch_name }}

      - name: Upload image metadata to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./image-metadata.json
          asset_name: image-metadata.json
          asset_content_type: application/json
