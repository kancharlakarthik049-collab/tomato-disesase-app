services:
  - type: web
    name: tomato-disease-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: models/tomato_model.onnx
      - key: DEBUG_MODE
        value: "false"
      - key: CONF_THRESH
        value: "0.6"
      - key: GOOGLE_DRIVE_MODEL_ID
        value: "YOUR_GOOGLE_DRIVE_FILE_ID_HERE"
        sync: false
